name: Lint

on:
  push:
    paths:
      - "datapack/**"
      - ".github/workflows/lint.yml"
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  mc-commands:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Minecraft 26.3 commands
        uses: mcbeet/check-commands@v1
        with:
          version: '0.69.0'
          source: datapack/data
          minecraft: '26.3'
          stats: true

  json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
      - name: Install jsonlint
        run: npm install --global jsonlint
      - name: Lint datapack JSON
        run: find datapack/data -name '*.json' -print0 | xargs -0 -n1 jsonlint -c
