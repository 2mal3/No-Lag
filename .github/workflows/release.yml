name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  NAME: 'No-Lag'
  MODRINTH_ID: 'f6S8twvO'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Package vanilla datapack
        uses: ComunidadAylas/PackSquash-action@v4
        with:
          packsquash_version: latest
          options: |
            pack_directory = 'datapack'
          artifact_name: datapack-raw
      - name: Download datapack archive
        uses: actions/download-artifact@v4
        with:
          name: datapack-raw
      - name: Finish datapack archive
        run: |
          mv pack.zip ${{ env.NAME }}.zip
          zip -u ${{ env.NAME }}.zip LICENSE.txt README.md CHANGELOG.md
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: |
            CHANGELOG.md
            ${{ env.NAME }}.zip

  release-github:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: artifact
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.NAME }} ${{github.ref_name}}
          body_path: CHANGELOG.md
          files: ${{ env.NAME }}.zip

  release-modrinth:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: artifact
      - name: Publish on Modrinth
        uses: Kir-Antipov/mc-publish@v3.2
        with:
          modrinth-id: ${{ env.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          name: ${{ env.NAME }} ${{github.ref_name}}
          files-primary: ${{ env.NAME }}.zip
          version: ${{github.ref_name}}
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: datapack
          game-versions: |
            26.3
